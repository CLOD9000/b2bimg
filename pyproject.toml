[project]
name = "b2bimg"
version = "1.0.0"
description = "Portale interno self-hosted per il download automatizzato di immagini prodotto da più sorgenti."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "tests/_work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "N"]
ignore = ["B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "N806", "N803", "B011"]
