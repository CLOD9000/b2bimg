{% from "macros/forms.html" import field_input %}
<div id="{{ kind }}-fields" class="fields">
  {% if spec %}
    <p class="help">{{ spec.description }}</p>
    {% for field in spec.fields %}
      {{ field_input(field, current, kind) }}
    {% endfor %}
  {% else %}
    <p class="muted">Seleziona {{ 'una sorgente' if kind == 'src' else 'una destinazione' }} per vedere i parametri.</p>
  {% endif %}
</div>
