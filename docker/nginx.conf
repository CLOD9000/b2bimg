# Reverse proxy opzionale (profilo "proxy" di docker-compose).
# Aggiunge basic auth davanti al portale; terminare TLS qui o su un proxy esterno.

server {
    listen 8080;
    server_name _;

    # Consente upload CSV fino a ~32 MB (allineare a MAX_UPLOAD_MB lato app).
    client_max_body_size 32m;

    # Header inoltrati all'app (utili per IP nei log di login).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    auth_basic "b2bimg - area interna";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        proxy_pass http://app:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /healthz {
        auth_basic off;
        proxy_pass http://app:8000;
    }
}
