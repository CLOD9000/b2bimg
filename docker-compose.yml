# =============================================================================
# b2bimg — portale interno di download immagini prodotto
#
# Avvio rapido:
#   cp .env.example .env && $EDITOR .env      # imposta ADMIN_PASSWORD e SECRET_KEY
#   docker compose up -d --build
#   open http://127.0.0.1:8000
#
# L'app pubblica la porta SOLO su 127.0.0.1: per l'accesso dalla rete interna
# usa il profilo "proxy" (reverse proxy nginx con basic auth + TLS) leggendo la
# sezione "Esposizione in rete" del README.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: b2bimg:latest
    container_name: b2bimg
    env_file:
      - stack.env
    environment:
      # dentro il container il bind è SEMPRE 0.0.0.0: l'isolamento è garantito
      # dalla mappatura "ports:" (e/o dal reverse proxy). L'IP LAN della macchina
      # host NON è un indirizzo valido all'interno del container.
      APP_HOST: 0.0.0.0
      APP_PORT: "8001"
      DATA_DIR: /data
    volumes:
      - /home/dockeradmin/stacks/b2bimg:/data                      # SQLite, upload e output
      - /home/dockeradmin/stacks/b2bimg/images:/data/images:ro               # sorgente locale (opzionale)
      - /home/dockeradmin/stacks/b2bimg/output:/data/output                  # destinazione locale (opzionale)
    ports:
      # "host:container". Per esporre solo sulla LAN usa "192.168.9.14:8001:8001".
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,urllib.request; p=os.environ.get('APP_PORT','8000'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{p}/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true




